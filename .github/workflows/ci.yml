name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      JAX_PLATFORMS: cpu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (CPU jaxlib from PyPI)
        run: pip install -c constraints.txt -e ".[dev,jax]"
      - name: Run tests (includes a full rerun checked against results/*.json)
        run: pytest -q
      - name: Throughput harness runs (numbers are printed, never checked)
        run: python -m copulabatch.cli speed --max-n 30 --repeats 1 --no-write

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
